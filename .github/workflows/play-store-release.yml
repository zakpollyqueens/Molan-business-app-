name: Build and upload Molan Business to Google Play

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      upload_to_play_store:
        description: Upload the signed bundle to the Google Play internal testing track
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  android-app-bundle:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      PLAY_STORE_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
      HAS_ANDROID_SIGNING: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && secrets.ANDROID_KEYSTORE_PASSWORD != '' && secrets.ANDROID_KEY_ALIAS != '' && secrets.ANDROID_KEY_PASSWORD != '' }}
      HAS_PLAY_STORE_ACCESS: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - name: Install web and Android dependencies
        run: npm install
      - name: Generate web bundle and Android project
        run: |
          npm run prepare:web
          npx cap add android
          node scripts/configure-android-app-access.cjs
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Configure Android SDK and Play Store signing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, pathlib, re
          variables = pathlib.Path('android/variables.gradle')
          source = variables.read_text()
          for key, value in [('compileSdkVersion', '35'), ('targetSdkVersion', '35')]:
              source, count = re.subn(r'(?m)^(\s*' + key + r'\s*=\s*)\d+', lambda m: m.group(1) + value, source, count=1)
              if count != 1:
                  raise SystemExit('Could not set ' + key + ' to Android API 35 in android/variables.gradle')
          variables.write_text(source)

          build_file = pathlib.Path('android/build.gradle')
          build_source = build_file.read_text()
          build_source, count = re.subn(r'com\.android\.tools\.build:gradle:[0-9.]+', 'com.android.tools.build:gradle:8.6.1', build_source, count=1)
          if count != 1:
              raise SystemExit('Could not update Android Gradle Plugin to 8.6.1')
          build_file.write_text(build_source)

          wrapper = pathlib.Path('android/gradle/wrapper/gradle-wrapper.properties')
          wrapper_source = wrapper.read_text()
          wrapper_source, count = re.subn(r'gradle-[0-9.]+-(?:all|bin)\.zip', 'gradle-8.7-all.zip', wrapper_source, count=1)
          if count != 1:
              raise SystemExit('Could not update Gradle wrapper to 8.7')
          wrapper.write_text(wrapper_source)

          app_gradle = pathlib.Path('android/app/build.gradle')
          app_source = app_gradle.read_text()
          run_number = os.environ['GITHUB_RUN_NUMBER']
          app_source, code_count = re.subn(r'(?m)^(\s*versionCode\s+)\d+', lambda m: m.group(1) + run_number, app_source, count=1)
          app_source, name_count = re.subn(r'(?m)^(\s*versionName\s+)[\"\'][^\"\']+[\"\']', lambda m: m.group(1) + '\"1.0.' + run_number + '\"', app_source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not safely set Android versionCode/versionName')
          if os.environ.get('HAS_ANDROID_SIGNING', '').lower() == 'true':
              app_source = app_source.replace('    buildTypes {', '''    signingConfigs {
              release {
                  storeFile file("upload-keystore.jks")
                  storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("ANDROID_KEY_ALIAS")
                  keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
          }

              buildTypes {''', 1)
              match = re.search(r'(buildTypes\s*\{\s*release\s*\{)', app_source)
              if not match:
                  raise SystemExit('Could not locate release build type to attach signing config')
              app_source = app_source[:match.end()] + '\n            signingConfig signingConfigs.release' + app_source[match.end():]
          app_gradle.write_text(app_source)
          print('Configured Android API 35 and version 1.0.' + run_number + ' (code ' + run_number + ').')
          print('Release signing configured: ' + str(os.environ.get('HAS_ANDROID_SIGNING', '').lower() == 'true'))
          PY
      - name: Install upload keystore
        if: env.HAS_ANDROID_SIGNING == 'true'
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          test -s android/app/upload-keystore.jks
      - name: Build release Android App Bundle
        working-directory: android
        run: ./gradlew --no-daemon bundleRelease
      - name: Verify App Bundle and report signing state
        shell: bash
        run: |
          set -euo pipefail
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -s "$AAB"
          ls -lh "$AAB"
          sha256sum "$AAB"
          if [[ "$HAS_ANDROID_SIGNING" == 'true' ]]; then
            echo '::notice::Signed-release configuration was enabled. Play Store upload can proceed if the Play Console service account is configured.'
          else
            echo '::warning::This AAB is unsigned and cannot be uploaded to Google Play. Configure the four ANDROID_KEYSTORE_* secrets to produce a signed release.'
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: molan-business-android-aab-${{ github.run_number }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30
      - name: Verify credentials before Play Store upload
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_play_store)
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$HAS_ANDROID_SIGNING" != 'true' || "$HAS_PLAY_STORE_ACCESS" != 'true' ]]; then
            if [[ "$GITHUB_EVENT_NAME" == 'workflow_dispatch' && "${{ inputs.upload_to_play_store }}" == 'true' ]]; then
              echo '::error::Upload requested, but Android signing or Play Console service-account secrets are missing.'
              exit 1
            fi
            echo '::notice::Skipping Play Store upload because Android signing or Play Console service-account secrets are not configured.'
            exit 0
          fi
          echo 'Play Store credentials are configured.'
      - name: Upload signed bundle to Google Play internal testing
        if: env.HAS_ANDROID_SIGNING == 'true' && env.HAS_PLAY_STORE_ACCESS == 'true' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.upload_to_play_store))
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlain: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          packageName: com.zakmolanitech.molanbusiness
          releaseFiles: android/app/build/outputs/bundle/release/app-release.aab
          track: internal
          status: completed
