name: Generate dedicated business profiles
# Generate missing profile pages and add profile-scoped navigation.

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/generate-extended-business-profiles.yml'
      - 'business-profiles/extended-catalog.json'
      - 'business-profiles/registry.json'
      - 'business-profiles/**/profile.json'
      - 'scripts/generate-extended-business-profiles.mjs'
      - 'shared/profile-device-access.js'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: generate-extended-business-profiles-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate dedicated profile folders and feature pages
        run: node scripts/generate-extended-business-profiles.mjs
      - name: Validate generated profiles
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const catalog = JSON.parse(fs.readFileSync('business-profiles/extended-catalog.json', 'utf8'));
          const registry = JSON.parse(fs.readFileSync('business-profiles/registry.json', 'utf8'));
          if (!Number.isInteger(catalog.profiles.length) || catalog.profiles.length < 1) throw new Error('Extended catalogue is empty or invalid');
          for (const p of catalog.profiles) {
            for (const file of [`business-profiles/${p.slug}/profile.json`, `business-profiles/${p.slug}/index.html`, `business-profiles/${p.slug}/profile.js`, `business-profiles/${p.slug}/profile.css`]) {
              if (!fs.existsSync(file)) throw new Error('Missing generated file: ' + file);
            }
            const config = JSON.parse(fs.readFileSync(`business-profiles/${p.slug}/profile.json`, 'utf8'));
            if (config.slug !== p.slug || !Array.isArray(config.features) || !config.features.length) throw new Error('Invalid profile config: ' + p.slug);
            for (const f of config.features) {
              const page = `business-profiles/${p.slug}/pages/${String(f.title).toLowerCase().normalize('NFKD').replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s_]+/g, '-').replace(/-+/g, '-')}/index.html`;
              if (!fs.existsSync(page)) throw new Error('Missing feature page: ' + page);
            }
          }
          const indexed = registry.profiles.filter(p => catalog.profiles.some(c => c.slug === p.slug));
          if (indexed.length !== catalog.profiles.length) throw new Error('Registry does not include every extended profile');
          for (const p of registry.profiles) {
            const configPath = p.config || `business-profiles/${p.slug}/profile.json`;
            const indexPath = p.page || `business-profiles/${p.slug}/index.html`;
            if (!fs.existsSync(configPath) || !fs.existsSync(indexPath)) throw new Error('Missing primary profile configuration/page: ' + p.slug);
            const overviewHtml = fs.readFileSync(indexPath, 'utf8');
            if (!overviewHtml.includes('data-profile-hamburger')) throw new Error('Missing profile hamburger: ' + indexPath);
            if (!overviewHtml.includes('data-give-device-access') || !overviewHtml.includes('data-profile-device-access')) throw new Error('Missing Give Access to Mobile & PC App action/script: ' + indexPath);
            const config = JSON.parse(fs.readFileSync(configPath, 'utf8'));
            if (!Array.isArray(config.features)) throw new Error('Missing features for profile: ' + p.slug);
            for (const f of config.features) {
              const slug = String(f.title).toLowerCase().normalize('NFKD').replace(/[^a-z0-9\s-]/g, '').trim().replace(/[\s_]+/g, '-').replace(/-+/g, '-');
              const page = `business-profiles/${p.slug}/pages/${slug}/index.html`;
              if (!fs.existsSync(page)) throw new Error('Missing profile feature page: ' + page);
              const featureHtml = fs.readFileSync(page, 'utf8');
              if (!featureHtml.includes('data-profile-hamburger')) throw new Error('Missing feature hamburger: ' + page);
              if (!featureHtml.includes('data-give-device-access') || !featureHtml.includes('data-profile-device-access')) throw new Error('Missing Give Access to Mobile & PC App action/script: ' + page);
              if (!featureHtml.includes('data-profile-feature-launch')) throw new Error('Missing feature launch button: ' + page);
            }
          }
          const accessRuntime = fs.readFileSync('shared/profile-device-access.js', 'utf8');
          for (const required of ['data-give-device-access','data-profile-device-access-dialog','new MutationObserver','ensureAccessMenuItem','business-app-handoff','targetDevice']) {
            if (!accessRuntime.includes(required)) throw new Error('Give Access runtime is missing required behavior: ' + required);
          }
          console.log('Validated ' + registry.profiles.length + ' registered business profiles, every declared feature page, and resilient device-access navigation.');
          NODE
      - name: Commit generated profiles to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add business-profiles/registry.json business-profiles/*/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Generate dedicated business profile workspaces"
          git push origin HEAD:main
