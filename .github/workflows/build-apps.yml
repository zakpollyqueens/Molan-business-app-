name: Build Molan Business apps

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install build dependencies
        run: npm install
      - name: Prepare web app and generate Android project
        run: |
          npm run prepare:web
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify APK and report size
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@v4
        with:
          name: molan-business-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows-desktop:
    name: Build Windows desktop installer
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Build Windows installer
        run: npm run build:windows
      - name: Verify installer and report size
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/desktop -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          $sizeMB = [math]::Round($installer.Length / 1MB, 2)
          Write-Output "Installer: $($installer.FullName)"
          Write-Output "Size: $sizeMB MB"
          Get-FileHash $installer.FullName -Algorithm SHA256
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: molan-business-windows-installer
          path: dist/desktop/*.exe
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish installable release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android-apk, windows-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Android APK artifact
        uses: actions/download-artifact@v4
        with:
          name: molan-business-android-apk
          path: release/android
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v4
        with:
          name: molan-business-windows-installer
          path: release/windows
      - name: Prepare stable release filenames
        run: |
          cp release/android/app-debug.apk release/Molan-Business.apk
          installer="$(find release/windows -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          test -n "$installer"
          cp "$installer" release/Molan-Business-Setup.exe
          ls -lh release/Molan-Business.apk release/Molan-Business-Setup.exe
          sha256sum release/Molan-Business.apk release/Molan-Business-Setup.exe
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Molan Business v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: |
            release/Molan-Business.apk
            release/Molan-Business-Setup.exe
