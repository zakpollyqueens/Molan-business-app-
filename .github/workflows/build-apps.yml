name: Build Molan Business apps

on:
  push:
    branches:
      - main
      - 'feat/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm install
      - name: Prepare web app and generate Android project
        run: |
          npm run prepare:web
          npx cap add android
          node scripts/configure-android-app-access.cjs
          npx capacitor-assets generate --android
          npx cap sync android
      - name: Set Android version code and name
        working-directory: android
        shell: bash
        run: |
          python - <<'PY'
          import os, pathlib, re
          path = pathlib.Path('app/build.gradle')
          source = path.read_text()
          build = os.environ['GITHUB_RUN_NUMBER']
          source, code_count = re.subn(r'(?m)^(\s*versionCode\s+)\d+', lambda m: m.group(1) + build, source, count=1)
          source, name_count = re.subn(r"""(?m)^(\s*versionName\s+)["'][^"']+["']""", lambda m: m.group(1) + '"1.0.' + build + '"', source, count=1)
          if code_count != 1 or name_count != 1:
              raise SystemExit('Could not safely set Android versionCode/versionName in app/build.gradle')
          path.write_text(source)
          print('Android version: 1.0.' + build + ' (code ' + build + ')')
          PY
      - name: Build debug APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug
      - name: Verify APK
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk
          sha256sum android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: molan-business-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

  windows-desktop:
    name: Build Windows desktop installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Set desktop package version
        shell: bash
        run: npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
      - run: npm run build:windows
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist/desktop -Filter *.exe | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer was not generated.' }
          Write-Output "Size MB: $([math]::Round($installer.Length / 1MB, 2))"
          Get-FileHash $installer.FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: molan-business-windows-installer
          path: dist/desktop/*.exe
          if-no-files-found: error
          retention-days: 30

  macos-desktop:
    name: Build macOS installers (Intel and Apple Silicon)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Set desktop package version
        shell: bash
        run: npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
      - run: npm run build:macos
      - name: Verify macOS installers and report sizes
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/desktop/*.dmg dist/desktop/*.zip)
          test "${#files[@]}" -gt 0 || { echo "No macOS installer was generated"; exit 1; }
          ls -lh "${files[@]}"
          shasum -a 256 "${files[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: molan-business-macos-installers
          path: |
            dist/desktop/*.dmg
            dist/desktop/*.zip
          if-no-files-found: error
          retention-days: 30

  linux-desktop:
    name: Build Linux installers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - name: Set desktop package version
        shell: bash
        run: npm version "1.0.${GITHUB_RUN_NUMBER}" --no-git-tag-version --allow-same-version
      - run: npm run build:linux
      - name: Verify Linux installers and report sizes
        run: |
          shopt -s nullglob
          files=(dist/desktop/*.AppImage dist/desktop/*.deb)
          test "${#files[@]}" -gt 0 || { echo "No Linux installer was generated"; exit 1; }
          ls -lh "${files[@]}"
          sha256sum "${files[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: molan-business-linux-installers
          path: |
            dist/desktop/*.AppImage
            dist/desktop/*.deb
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish cross-platform release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [android-apk, windows-desktop, macos-desktop, linux-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: molan-business-android-apk
          path: release/android
      - uses: actions/download-artifact@v4
        with:
          name: molan-business-windows-installer
          path: release/windows
      - uses: actions/download-artifact@v4
        with:
          name: molan-business-macos-installers
          path: release/macos
      - uses: actions/download-artifact@v4
        with:
          name: molan-business-linux-installers
          path: release/linux
      - name: Prepare and verify release assets
        run: |
          set -euo pipefail
          mkdir -p release/assets
          # Do not publish a debug-signed APK as an install/update package.
          # Android production updates must come from the signed Play Store release.
          installer="$(find release/windows -maxdepth 1 -type f -name '*.exe' | head -n 1)"
          test -n "$installer"
          cp "$installer" release/assets/Molan-Business-Setup.exe
          find release/macos -maxdepth 1 -type f \( -name '*.dmg' -o -name '*.zip' \) -exec cp {} release/assets/ \;
          find release/linux -maxdepth 1 -type f \( -name '*.AppImage' -o -name '*.deb' \) -exec cp {} release/assets/ \;
          # A signed Android APK is intentionally not attached by this workflow.
          # The Android App Bundle is built and distributed through the Play Store workflow.
          test -s release/assets/Molan-Business-Setup.exe
          compgen -G 'release/assets/*.dmg' >/dev/null
          compgen -G 'release/assets/*.AppImage' >/dev/null
          ls -lh release/assets
          sha256sum release/assets/*
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Molan Business v1.0.${{ github.run_number }}
          generate_release_notes: true
          files: release/assets/*
