name: Deploy Molan Business to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install icon-generation dependencies
        run: npm install
      - name: Prepare and stage complete public site
        run: |
          npm run prepare:web
          mkdir -p _site
          cp -R www/. _site/
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published Give Access menu and runtime
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          base="${PAGE_URL%/}"
          for profile in grocery-shop supermarket translation-agency-business; do
            html="$(curl --fail --silent --show-error "$base/business-profiles/$profile/index.html")"
            printf '%s' "$html" | grep -q 'data-give-device-access' || { echo "Give Access menu item missing from live profile: $profile"; exit 1; }
            printf '%s' "$html" | grep -q 'data-profile-device-access' || { echo "Device-access runtime missing from live profile: $profile"; exit 1; }
          done
          curl --fail --silent --show-error "$base/shared/profile-device-access.js" | grep -q 'ensureAccessMenuItem' || { echo "Shared device-access runtime failed live verification"; exit 1; }
          echo "Live Give Access checks passed for all smoke-test profiles."
