name: Deploy Molan Business to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install icon-generation dependencies
        run: npm install
      - name: Prepare and stage complete public site
        run: |
          npm run prepare:web
          mkdir -p _site
          cp -R www/. _site/
          touch _site/.nojekyll
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify published Business Settings access placement
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          base="${PAGE_URL%/}"
          for profile in grocery-shop supermarket translation-agency-business sacco-savings-group; do
            html="$(curl --fail --silent --show-error "$base/business-profiles/$profile/index.html")"
            if printf '%s' "$html" | grep -q 'data-give-device-access'; then
              echo "Legacy Give Access item remains in profile hamburger: $profile"
              exit 1
            fi
          done
          app="$(curl --fail --silent --show-error "$base/app.js")"
          printf '%s' "$app" | grep -q 'device-access-settings-panel' || { echo "Device & App Access is missing from Business Settings"; exit 1; }
          printf '%s' "$app" | grep -q 'Get mobile app' || { echo "Mobile app access entry point missing"; exit 1; }
          printf '%s' "$app" | grep -q 'Get PC app' || { echo "PC app access entry point missing"; exit 1; }
          echo "Live Business Settings access-placement checks passed."
