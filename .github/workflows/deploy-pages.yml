name: Deploy Molan Business to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
  release:
    types: [published]
permissions:
  actions: read
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Install icon-generation dependencies
        run: npm install
      - name: Prepare and stage complete public site
        run: |
          npm run prepare:web
          mkdir -p _site
          cp -R www/. _site/
          # Always include a root homepage in the uploaded Pages artifact.
          test -s _site/index.html || cp index.html _site/index.html
          test -s _site/index.html
          touch _site/.nojekyll
      - name: Sync latest published release into update manifest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.request
          repository = os.environ["REPOSITORY"]
          request = urllib.request.Request(
              "https://api.github.com/repos/" + repository + "/releases/latest",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "X-GitHub-Api-Version": "2022-11-28",
              },
          )
          with urllib.request.urlopen(request, timeout=25) as response:
              release = json.load(response)
          manifest_path = "_site/version.json"
          with open(manifest_path, encoding="utf-8") as source:
              manifest = json.load(source)
          tag = release.get("tag_name", "")
          if not tag:
              raise SystemExit("Latest published release has no tag; refusing to publish an incomplete update manifest.")
          manifest["releaseVersion"] = tag.lstrip("vV")
          manifest["releaseTag"] = tag
          manifest["releasePage"] = release.get("html_url", "https://github.com/" + repository + "/releases/latest")
          manifest["releaseAssets"] = [
              {"name": asset.get("name", ""), "browser_download_url": asset.get("browser_download_url", "")}
              for asset in release.get("assets", [])
              if asset.get("name") and asset.get("browser_download_url")
          ]
          with open(manifest_path, "w", encoding="utf-8") as output:
              json.dump(manifest, output, indent=2)
              output.write("\n")
          print("Published updater manifest for " + tag + " with " + str(len(manifest["releaseAssets"])) + " release assets.")
          PY
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify the published Give Access menu and runtime
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -eu
          base="${PAGE_URL%/}"
          homepage="$(curl --fail --silent --show-error "$base/")"
          printf '%s' "$homepage" | grep -qi '<title>Molan Business</title>' || { echo "Molan Business homepage is missing or incorrect at $base/"; exit 1; }
          curl --fail --silent --show-error "$base/index.html" | grep -qi '<title>Molan Business</title>' || { echo "Molan Business index.html is not available at $base/index.html"; exit 1; }
          echo "Molan Business homepage verified at $base/"
          for profile in grocery-shop supermarket translation-agency-business sacco-savings-group; do
            html="$(curl --fail --silent --show-error "$base/business-profiles/$profile/index.html")"
            printf '%s' "$html" | grep -q 'data-give-device-access' || { echo "Give Access menu item missing from live profile: $profile"; exit 1; }
            printf '%s' "$html" | grep -q 'data-profile-device-access' || { echo "Device-access runtime missing from live profile: $profile"; exit 1; }
          done
          curl --fail --silent --show-error "$base/shared/profile-device-access.js" | grep -q 'ensureAccessMenuItem' || { echo "Shared device-access runtime failed live verification"; exit 1; }
          echo "Live Give Access checks passed for all smoke-test profiles, including SACCO savings group."
